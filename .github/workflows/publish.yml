name: Publish to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52

      - name: Install mdBook Mermaid preprocessor
        uses: taiki-e/install-action@v2
        with:
          # 0.17 targets the mdBook 0.5 preprocessor API; this book uses mdBook 0.4.
          tool: mdbook-mermaid@0.16.2

      - name: Build the book
        run: mdbook build

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: gh-pages
          publish_dir: ./book
          enable_jekyll: false
          commit_message: "Deploy mdBook site"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
