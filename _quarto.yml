project:
  type: book
  output-dir: _site

book:
  title: "Agentic AI Engineering Study Book"
  subtitle: "A production-oriented roadmap from Python foundations to multi-agent systems"
  author: "Ranjeet Harishchandre"
  date: last-modified
  site-url: "https://agentic-ai-study-book.vercel.app"
  search: true

  chapters:
    - index.qmd

    - part: phase-01-production-python/index.qmd
      chapters:
        - phase-01-production-python/01-type-hints.qmd
        - phase-01-production-python/02-dataclasses.qmd

format:
  html:
    theme:
      - cosmo
      - styles/theme.scss
    css:
      - assets/fonts/fonts.css
      - styles/custom.css
    toc: true
    toc-depth: 2
    number-sections: false
    code-overflow: wrap

execute:
  freeze: true
