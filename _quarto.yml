project:
  type: book
  output-dir: _site

book:
  title: "Agentic AI Engineering Study Book"
  subtitle: "A production-oriented roadmap from Python foundations to multi-agent systems"
  author: "Ranjeet Harishchandre"
  date: last-modified
  site-url: "https://ranjeet-h.github.io/agentic-ai-engineer-book"
  search: true

  chapters:
    - index.qmd

    - part: phase-01-production-python/index.qmd
      chapters:
        - phase-01-production-python/01-type-hints.qmd
        - phase-01-production-python/02-dataclasses.qmd
        - phase-01-production-python/03-pydantic.qmd
        - phase-01-production-python/04-decorators.qmd
        - phase-01-production-python/05-iterators-and-generators.qmd
        - phase-01-production-python/06-context-managers.qmd
        - phase-01-production-python/07-exception-handling.qmd
        - phase-01-production-python/08-file-handling.qmd
        - phase-01-production-python/09-async-and-asyncio.qmd
        - phase-01-production-python/10-threads-and-processes.qmd
        - phase-01-production-python/11-concurrency-patterns.qmd
        - phase-01-production-python/12-packaging-and-virtual-environments.qmd
        - phase-01-production-python/13-dependency-management.qmd
        - phase-01-production-python/14-logging.qmd
        - phase-01-production-python/15-configuration-management.qmd
        - phase-01-production-python/16-pytest.qmd
        - phase-01-production-python/17-mocking.qmd
        - phase-01-production-python/18-profiling-and-performance.qmd
        - phase-01-production-python/19-fastapi.qmd
        - phase-01-production-python/20-sqlalchemy.qmd
        - phase-01-production-python/21-alembic.qmd
        - phase-01-production-python/22-postgresql.qmd
        - phase-01-production-python/23-redis.qmd
        - phase-01-production-python/24-authentication-and-authorization.qmd
        - phase-01-production-python/25-background-jobs.qmd
        - phase-01-production-python/26-rate-limiting.qmd
        - phase-01-production-python/27-api-testing.qmd
        - phase-01-production-python/28-dockerizing-python-applications.qmd
        - phase-01-production-python/29-cicd-for-python-services.qmd

format:
  html:
    theme:
      - cosmo
      - styles/theme.scss
    css:
      - assets/fonts/fonts.css
      - styles/custom.css
    toc: true
    toc-depth: 2
    number-sections: false
    code-overflow: wrap

execute:
  freeze: true
