[book]
title = "Agentic AI Engineering Study Book"
authors = ["Ranjeet Harishchandre"]
description = "A production-oriented roadmap from Python foundations to multi-agent systems"
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
no-section-label = true
smart-punctuation = true
git-repository-url = "https://github.com/ranjeet-h/agentic-ai-engineer-book"
git-repository-icon = "fa-github"
site-url = "https://ranjeet-h.github.io/agentic-ai-engineer-book/"
additional-css = [
  "styles/navigation.css",
]
additional-js = [
  "theme/mermaid.min.js",
  "theme/mermaid-init.js",
]

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = true

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
